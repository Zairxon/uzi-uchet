<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e75" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1719" media="(prefers-color-scheme: dark)">
<meta name="description" content="Внутренний учёт УЗИ-центра: операции, зарплата, кредит, отчёты">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Учёт УЗИ-центра</title>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg></div>
      <div class="top-l">
        <h1>Учёт УЗИ-центра</h1>
        <span id="status" class="chip">Подключение…</span>
      </div>
      <button class="theme" id="theme" data-act="theme" aria-label="Сменить тему"></button>
    </div>
    <div class="mnav">
      <button class="btn ghost sq" data-act="prev" aria-label="Предыдущий месяц">‹</button>
      <b id="mlabel"></b>
      <button class="btn ghost sq" data-act="next" aria-label="Следующий месяц">›</button>
    </div>
  </div>
  <div class="tabs"><div class="tabs-in" id="tabs" role="tablist"></div></div>
  <main id="view"><p class="empty">Загружаю данные. Здесь появятся выручка, расходы, зарплата, кредит и отчёты за выбранный месяц.</p></main>
</div>
<div id="toast" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
